<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>山南自動車 GACHA</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  padding:
  28px 12px
  60px;

  background:
  radial-gradient(
    circle at top,
    #282b30 0%,
    #0d0e10 45%,
    #020202 100%
  );

  color:#fff;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  "Noto Sans JP",
  sans-serif;

}

.wrap{

  width:100%;

  max-width:500px;

  margin:auto;

  text-align:center;

}


/* =====================
   LOGO
===================== */

.yamanan-logo{

  display:block;

  width:90%;

  max-width:420px;

  height:auto;

  margin:
  0 auto
  18px;

}

.lead{

  margin-bottom:24px;

  color:#bbb;

  font-size:14px;

  line-height:1.8;

}


/* =====================
   DASHBOARD
===================== */

.dashboard{

  position:relative;

  width:100%;

  max-width:480px;

  margin:auto;

  padding:
  16px 4px
  22px;

  overflow:hidden;

  border:
  2px solid #353535;

  border-radius:34px;

  background:
  linear-gradient(
    180deg,
    #17191d 0%,
    #040506 100%
  );

  box-shadow:
  inset 0 0 35px #000,
  0 25px 50px rgba(0,0,0,.75);

}


/* 上部ダッシュ曲線 */

.dashboard::before{

  content:"";

  position:absolute;

  top:-80px;

  left:-10%;

  width:120%;

  height:150px;

  border:
  8px solid #292929;

  border-radius:50%;

  opacity:.55;

}


.cluster{

  position:relative;

  z-index:2;

  display:block;

  width:100%;

  height:auto;

}


/* =====================
   GAUGE
===================== */

.gauge-ring{

  fill:#070809;

  stroke:#888;

  stroke-width:3;

}

.gauge-inner{

  fill:none;

  stroke:#25272a;

  stroke-width:7;

}

.tick-major{

  stroke:#eee;

  stroke-width:3.2;

  stroke-linecap:round;

}

.tick-minor{

  stroke:#777;

  stroke-width:1.4;

  stroke-linecap:round;

}

.number{

  fill:#e7e7e7;

  font-size:13px;

  text-anchor:middle;

}

.small-number{

  fill:#ccc;

  font-size:10px;

  text-anchor:middle;

}

.unit{

  fill:#999;

  font-size:8px;

  text-anchor:middle;

  letter-spacing:1px;

}


/* =====================
   NEEDLE
===================== */

.needle-main{

  stroke:#f6f6f6;

  stroke-width:4;

  stroke-linecap:round;

  filter:
  drop-shadow(
    0 2px 2px #000
  );

}

.needle-side{

  stroke:#eee;

  stroke-width:3;

  stroke-linecap:round;

}

.hub-outer{

  fill:#15171b;

  stroke:#454545;

  stroke-width:3;

}

.hub-inner{

  fill:#292c34;

}


/* =====================
   DIGITAL
===================== */

.digital{

  position:absolute;

  z-index:10;

  left:50%;

  bottom:29px;

  transform:
  translateX(-50%);

  min-width:130px;

  padding:
  8px 14px;

  border:
  1px solid #333;

  border-radius:5px;

  background:#060708;

  color:#aaa;

  font-family:
  monospace;

  font-size:12px;

  letter-spacing:2px;

  box-shadow:
  inset 0 0 9px #000;

}


.digital.running{

  color:#eee;

}


.digital.confirm{

  color:#ff3434;

  border-color:#8f0000;

  box-shadow:
  0 0 15px rgba(255,0,0,.45),
  inset 0 0 10px #000;

  animation:
  confirmFlash
  .45s
  4;

}


/* =====================
   SPEED表示
===================== */

.speed-display{

  position:absolute;

  z-index:7;

  left:50%;

  top:53%;

  transform:
  translate(-50%,-50%);

  pointer-events:none;

}

.speed-number{

  display:block;

  font-size:21px;

  font-weight:700;

  color:#ddd;

  line-height:1;

}

.speed-unit{

  display:block;

  margin-top:3px;

  color:#777;

  font-size:8px;

  letter-spacing:1px;

}


/* =====================
   START BUTTON
===================== */

.start-button{

  width:100%;

  max-width:340px;

  margin-top:30px;

  padding:
  20px 10px;

  border:none;

  border-radius:60px;

  background:
  linear-gradient(
    180deg,
    #f43c3c,
    #b60000
  );

  color:#fff;

  font-size:20px;

  font-weight:900;

  letter-spacing:2px;

  box-shadow:
  0 8px 0 #6e0000,
  0 18px 35px rgba(0,0,0,.55);

  cursor:pointer;

}


.start-button:active{

  transform:
  translateY(5px);

  box-shadow:
  0 3px 0 #6e0000;

}


.start-button:disabled{

  opacity:.72;

}


.start-note{

  margin-top:16px;

  color:#777;

  font-size:10px;

  letter-spacing:5px;

}


/* =====================
   RESULT
===================== */

.result-area{

  display:none;

  margin-top:30px;

  padding:
  28px 20px
  24px;

  border-radius:26px;

  background:#fff;

  color:#111;

  box-shadow:
  0 18px 50px rgba(0,0,0,.65);

}


.result-area.show{

  display:block;

  animation:
  resultShow
  .5s ease;

}


.result-grade{

  margin-bottom:9px;

  color:#bd0000;

  font-size:20px;

  font-weight:900;

  letter-spacing:2px;

}


.prize-name{

  margin-bottom:20px;

  font-size:27px;

  font-weight:900;

  line-height:1.4;

}


/* =====================
   景品画像
===================== */

.prize-visual{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  max-width:320px;

  min-height:180px;

  margin:
  0 auto
  20px;

  padding:20px;

  border:
  2px dashed #ccc;

  border-radius:18px;

  background:
  linear-gradient(
    145deg,
    #f5f5f5,
    #e8e8e8
  );

}


.prize-placeholder{

  color:#555;

  font-size:17px;

  font-weight:800;

}


.prize-placeholder small{

  display:block;

  margin-top:9px;

  color:#999;

  font-size:11px;

  font-weight:400;

}


.prize-image{

  display:none;

  width:100%;

  max-height:270px;

  object-fit:contain;

  border-radius:12px;

}


.result-note{

  margin-bottom:20px;

  color:#555;

  font-size:14px;

  line-height:1.8;

}


/* =====================
   REDEEM
===================== */

.redeem-button{

  width:100%;

  padding:
  18px 10px;

  border:none;

  border-radius:14px;

  background:#111;

  color:#fff;

  font-size:17px;

  font-weight:900;

  cursor:pointer;

}


.redeem-button.redeemed{

  background:#999;

  color:#eee;

}


.staff-note{

  margin-top:11px;

  color:#999;

  font-size:11px;

}


/* =====================
   演出
===================== */

.dashboard.high-prize{

  animation:
  dashboardGlow
  .5s
  4;

}


@keyframes dashboardGlow{

  0%{

    box-shadow:
    inset 0 0 35px #000,
    0 25px 50px rgba(0,0,0,.75);

  }

  50%{

    box-shadow:
    inset 0 0 40px rgba(170,0,0,.7),
    0 0 35px rgba(255,0,0,.45);

  }

  100%{

    box-shadow:
    inset 0 0 35px #000,
    0 25px 50px rgba(0,0,0,.75);

  }

}


@keyframes confirmFlash{

  0%{
    opacity:1;
  }

  50%{
    opacity:.3;
  }

  100%{
    opacity:1;
  }

}


@keyframes resultShow{

  from{

    opacity:0;

    transform:
    translateY(20px)
    scale(.96);

  }

  to{

    opacity:1;

    transform:
    translateY(0)
    scale(1);

  }

}

</style>

</head>

<script>


/* =========================
   景品設定
========================= */

const prizes = [

{

grade:"1等",

name:
"JCBギフト券 20,000円",

weight:1,

speed:120,

image:
"prize1.png",

note:
"スタッフにこの画面を提示してください。"

},


{

grade:"2等",

name:
"商品券 5,000円",

weight:3,

speed:110,

image:
"prize2.png",

note:
"スタッフにこの画面を提示してください。"

},


{

grade:"3等",

name:
"エンジンオイル交換無料券",

weight:5,

speed:100,

image:
"prize3.png",

note:
"5Lまで対象です。スタッフにこの画面を提示してください。"

},


{

grade:"4等",

name:
"山形食品ジュース 5缶セット",

weight:10,

speed:60,

image:
"prize4.png",

note:
"1,500円相当。スタッフにこの画面を提示してください。"

},


{

grade:"5等",

name:
"Hanamori お食事券 1,000円分",

weight:15,

speed:40,

image:
"prize5.png",

note:
"スタッフにこの画面を提示してください。"

},


{

grade:"6等",

name:
"Hanamori ドリンク券",

weight:200,

speed:20,

image:
"prize6.png",

note:
"当日限り有効です。スタッフにこの画面を提示してください。"

}

];



/* =========================
   目盛り
========================= */

function makeTicks(
groupId,
cx,
cy,
radius,
start,
end,
majorCount,
subdivisions,
labels
){

const group =
document.getElementById(
groupId
);


const total =
majorCount *
subdivisions;


for(
let i=0;
i<=total;
i++
){

const ratio =
i / total;


const angle =
start +
(end-start)
*
ratio;


const rad =
(angle-90)
*
Math.PI
/
180;


const major =
i %
subdivisions
===
0;


const outer =
radius;


const inner =
radius -
(
major
?
14
:
7
);


const x1 =
cx +
outer *
Math.cos(rad);


const y1 =
cy +
outer *
Math.sin(rad);


const x2 =
cx +
inner *
Math.cos(rad);


const y2 =
cy +
inner *
Math.sin(rad);


const line =
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);


line.setAttribute(
"x1",
x1
);

line.setAttribute(
"y1",
y1
);

line.setAttribute(
"x2",
x2
);

line.setAttribute(
"y2",
y2
);


line.setAttribute(
"class",
major
?
"tick-major"
:
"tick-minor"
);


group.appendChild(
line
);



if(
major &&
labels
){

const index =
i /
subdivisions;


if(
labels[index]
!== undefined
){

const tr =
radius - 31;


const tx =
cx +
tr *
Math.cos(rad);


const ty =
cy +
tr *
Math.sin(rad)
+
5;


const text =
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);


text.setAttribute(
"x",
tx
);

text.setAttribute(
"y",
ty
);

text.setAttribute(
"class",
"number"
);


text.textContent =
labels[index];


group.appendChild(
text
);

}

}

}

}



/* 中央 */

makeTicks(

"mainTicks",

300,

155,

108,

-125,

125,

9,

4,

[
"0",
"20",
"40",
"60",
"80",
"100",
"120",
"140",
"160",
"180"
]

);



/* 左 */

makeTicks(

"leftTicks",

135,

175,

82,

-130,

130,

6,

4,

[
"0",
"1",
"2",
"3",
"4",
"5",
"6"
]

);



/* 右 */

makeTicks(

"rightTicks",

465,

175,

82,

-130,

130,

6,

4,

null

);



/* =========================
   DOM
========================= */

const dashboard =
document.getElementById(
"dashboard"
);


const mainNeedle =
document.getElementById(
"mainNeedle"
);


const leftNeedle =
document.getElementById(
"leftNeedle"
);


const rightNeedle =
document.getElementById(
"rightNeedle"
);


const startButton =
document.getElementById(
"startButton"
);


const digital =
document.getElementById(
"digital"
);


const speedNumber =
document.getElementById(
"speedNumber"
);


const resultArea =
document.getElementById(
"resultArea"
);


const resultGrade =
document.getElementById(
"resultGrade"
);


const prizeName =
document.getElementById(
"prizeName"
);


const resultNote =
document.getElementById(
"resultNote"
);


const prizeImage =
document.getElementById(
"prizeImage"
);


const prizePlaceholder =
document.getElementById(
"prizePlaceholder"
);


const redeemButton =

"redeemButton"
);



/* =========================
   針設定
========================= */

function speedToAngle(
speed
){

return
-125 +
(
speed /
180
)
*
250;

}


function setMainSpeed(
speed
){

const angle =
speedToAngle(
speed
);


mainNeedle.setAttribute(

"transform",

`rotate(${angle} 300 155)`

);


speedNumber.textContent =
Math.round(
speed
);

}


function setLeft(
angle
){

leftNeedle.setAttribute(

"transform",

`rotate(${angle} 135 175)`

);

}


function setRight(
angle
){

rightNeedle.setAttribute(

"transform",

`rotate(${angle} 465 175)`

);

}



/* 初期位置 */

setMainSpeed(
0
);

setLeft(
-115
);

setRight(
35
);



/* =========================
   抽選
========================= */

function drawPrize(){

let total =
0;


prizes.forEach(
prize => {

total +=
prize.weight;

}
);


let random =
Math.random()
*
total;


for(
const prize
of prizes
){

random -=
prize.weight;


if(
random < 0
){

return prize;

}

}


return prizes[
prizes.length-1
];

}



/* =========================
   イージング

   最初ゆっくり
   中盤加速
   最後ゆっくり
========================= */

function easeInOutCubic(
t
){

return
t < 0.5

?

4 *
t *
t *
t

:

1 -
Math.pow(
-2*t+2,
3
)
/
2;

}



/* =========================
   メーター演出
========================= */

function animateToSpeed(
targetSpeed,
duration
){

return new Promise(
resolve => {


const startTime =
performance.now();


const startSpeed =
0;


function frame(
now
){

const elapsed =
now -
startTime;


const progress =
Math.min(
elapsed /
duration,
1
);


const eased =
easeInOutCubic(
progress
);


const currentSpeed =
startSpeed +
(
targetSpeed -
startSpeed
)
*
eased;


setMainSpeed(
currentSpeed
);



/*
  左タコメーターも
  徐々に上がる
*/

const leftTarget =
-115 +
(
targetSpeed /
120
)
*
135;


const leftCurrent =
-115 +
(
leftTarget + 115
)
*
eased;


setLeft(
leftCurrent
);



/*
  右はほんの少しだけ
*/

const rightTarget =
35 +
(
targetSpeed /
120
)
*
18;


const rightCurrent =
35 +
(
rightTarget - 35
)
*
eased;


setRight(
rightCurrent
);



if(
progress < 1
){

requestAnimationFrame(
frame
);

}

else{

setMainSpeed(
targetSpeed
);


setLeft(
leftTarget
);


setRight(
rightTarget
);


resolve();

}

}


requestAnimationFrame(
frame
);


}
);

}



/* =========================
   確定演出
========================= */

function confirmationEffect(
prize
){

return new Promise(
resolve => {


/*
  1〜3等だけ
  強い確定演出
*/

if(
prize.speed >= 100
){

digital.textContent =
prize.grade +
" 確定！";


digital.classList.add(
"confirm"
);


dashboard.classList.add(
"high-prize"
);


setTimeout(
function(){


digital.classList.remove(
"confirm"
);


dashboard.classList.remove(
"high-prize"
);


resolve();


},
1900
);

}


/*
  4〜6等
*/

else{

digital.textContent =
prize.grade +
"！";


setTimeout(
resolve,
900
);

}


}
);

}



/* =========================
   結果表示
========================= */

function showResult(
prize
){

resultGrade.textContent =
prize.grade +
" 当選！";


prizeName.textContent =
prize.name;


resultNote.textContent =
prize.note;



/* 景品画像 */

prizeImage.style.display =
"none";


prizePlaceholder.style.display =
"block";


prizeImage.src =
prize.image;


prizeImage.onload =
function(){

prizePlaceholder.style.display =
"none";


prizeImage.style.display =
"block";

};



resultArea
.classList
.add(
"show"
);


setTimeout(
function(){

resultArea
.scrollIntoView({

behavior:
"smooth",

block:
"start"

});

},
250
);

}



/* =========================
   START
========================= */

startButton.addEventListener(
"click",
async function(){


/* 前回結果を消す */

resultArea
.classList
.remove(
"show"
);


digital
.classList
.remove(
"confirm"
);


dashboard
.classList
.remove(
"high-prize"
);


redeemButton.disabled =
false;


redeemButton
.classList
.remove(
"redeemed"
);


redeemButton.textContent =
"スタッフ確認で引換済みにする";



/* 初期位置 */

setMainSpeed(
0
);

setLeft(
-115
);

setRight(
35
);



/* 先に当選景品を決定 */

const prize =
drawPrize();



/* スタート */

startButton.disabled =
true;


startButton.textContent =
"ENGINE RUNNING...";


digital.textContent =
"ACCELERATING";


digital.classList.add(
"running"
);



/*
  4.2秒かけて
  当選位置へ
*/

await animateToSpeed(

prize.speed,

4200

);



digital.classList.remove(
"running"
);



/*
  針停止後
  少し間を置く
*/

await new Promise(
resolve =>
setTimeout(
resolve,
450
)
);



/*
  確定演出
*/

await confirmationEffect(
prize
);



/*
  RESULT
*/

digital.textContent =
"RESULT";


await new Promise(
resolve =>
setTimeout(
resolve,
350
)
);



showResult(
prize
);



/*
  デモなので再度可能
*/

startButton.disabled =
false;


startButton.textContent =
"DEMO AGAIN";


}
);



/* =========================
   引換
========================= */

redeemButton.addEventListener(
"click",
function(){


redeemButton.disabled =
true;


redeemButton
.classList
.add(
"redeemed"
);


redeemButton.textContent =
"引換済み";


}
);


</script>


</body>

</html>
